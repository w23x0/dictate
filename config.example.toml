# ~/.config/dictate/config.toml
# 北京：https://dashscope.aliyuncs.com
# 新加坡：https://dashscope-intl.aliyuncs.com
# 工作区域名：https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com
base_url = "https://dashscope.aliyuncs.com"
model = "qwen3-asr-flash"

# 空 = 自动识别；zh / en / yue / ja …
# language = "zh"

# 逆文本规范化（数字、单位）。听写默认关。
enable_itn = false

# 报文形状：留空按模型名推断；可选 openai / dashscope / ws
# api_style = "dashscope"

# 热键
hotkey = "ctrl+space"

# key 也可以走环境变量 DASHSCOPE_API_KEY（优先）
# api_key = "sk-…"

target_rms_dbfs = -20.0
silence_stop_ms = 1500
max_seconds = 240.0
timeout_secs = 60

# 真流式（边说边出字）：WebSocket 系模型（-message / -streaming / -realtime）生效，
# 失败自动回退「录完整段再转」。批量模型（qwen3-asr-flash 等）忽略此项。
streaming = true

# 把每次送到服务端的 WAV 留一份到 ~/.local/share/dictate/last.wav，
# 转写失败后可用 /retry 或托盘菜单「重转上一条」重转，不用重说
keep_audio = false
