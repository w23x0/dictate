# ~/.config/dictate/config.toml
# 北京：https://dashscope.aliyuncs.com
# 新加坡：https://dashscope-intl.aliyuncs.com
# 工作区域名：https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com
base_url = "https://dashscope.aliyuncs.com"
model = "qwen3-asr-flash"

# 空 = 自动识别；zh / en / yue / ja …
# language = "zh"

# 逆文本规范化（数字、单位）。听写默认关。
enable_itn = false

# key 也可以走环境变量 DASHSCOPE_API_KEY（优先）
# api_key = "sk-…"

target_rms_dbfs = -20.0
silence_stop_ms = 1500
max_seconds = 240.0
timeout_secs = 60
