[package]
name = "dictate"
version = "0.1.2"
edition = "2021"
description = "按住热键说话，文字进当前窗口（通义千问 ASR + 托盘）"
license = "MIT"
readme = "README.md"
repository = "https://github.com/w23x0/dictate"
keywords = ["asr", "dictation", "speech-to-text", "qwen", "tray"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
hound = "3.5"
cpal = "0.16"
rubato = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "time", "net", "macros", "sync"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
uuid = { version = "1", features = ["v4"] }
unicode-width = "0.2"
ratatui = "0.29"
crossterm = "0.28"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }

png = "0.17"
tray-icon = "0.19"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
