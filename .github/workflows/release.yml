name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    # arm64 用 GitHub 原生 arm runner，交叉编译 GTK/ALSA 在本机跑不通
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 系统依赖（ALSA + GTK3 + appindicator）
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: 构建
        run: cargo build --release --target ${{ matrix.target }}

      - name: 打包
        run: |
          cp target/${{ matrix.target }}/release/dictate dictate
          tar -czf dictate-${{ matrix.target }}.tar.gz dictate
          sha256sum dictate-${{ matrix.target }}.tar.gz > dictate-${{ matrix.target }}.tar.gz.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dictate-*.tar.gz
            dictate-*.tar.gz.sha256
