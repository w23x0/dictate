name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 系统依赖（cpal / tray / tauri 无关，只需要 ALSA + GTK3 + appindicator）
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: 交叉编译 aarch64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libasound2-dev:arm64 libgtk-3-dev:arm64 libayatana-appindicator3-dev:arm64
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: 构建
        run: cargo build --release --target ${{ matrix.target }}

      - name: 打包
        run: |
          cp target/${{ matrix.target }}/release/dictate dictate
          tar -czf dictate-${{ matrix.target }}.tar.gz dictate
          sha256sum dictate-${{ matrix.target }}.tar.gz > dictate-${{ matrix.target }}.tar.gz.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dictate-*.tar.gz
            dictate-*.tar.gz.sha256
